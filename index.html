<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Job Application Tracker</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f4f4f4;
    padding:20px;
}

.container{
    max-width:900px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

h1{
    text-align:center;
}

input,
select,
button{
    width:100%;
    padding:10px;
    margin-top:10px;
    box-sizing:border-box;
}

button{
    background:#0078d7;
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:#005ea6;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th,
td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:#0078d7;
    color:white;
}

.delete-btn{
    background:red;
    color:white;
    border:none;
    padding:5px 10px;
    cursor:pointer;
}

.stats{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

    <h1>💼 Job Application Tracker</h1>

    <input
        type="text"
        id="company"
        placeholder="Company Name">

    <input
        type="text"
        id="position"
        placeholder="Position">

    <select id="status">
        <option value="Applied">Applied</option>
        <option value="Interview">Interview</option>
        <option value="Offer">Offer</option>
        <option value="Rejected">Rejected</option>
    </select>

    <button onclick="addJob()">
        Add Application
    </button>

    <div class="stats">
        Total Applications:
        <span id="total">0</span>
    </div>

    <table>
        <thead>
            <tr>
                <th>Company</th>
                <th>Position</th>
                <th>Status</th>
                <th>Delete</th>
            </tr>
        </thead>

        <tbody id="jobTable">

        </tbody>
    </table>

</div>

<script>

let jobs =
JSON.parse(localStorage.getItem("jobs")) || [];

function saveJobs(){
    localStorage.setItem(
        "jobs",
        JSON.stringify(jobs)
    );
}

function addJob(){

    const company =
    document.getElementById("company").value;

    const position =
    document.getElementById("position").value;

    const status =
    document.getElementById("status").value;

    if(company === "" || position === ""){
        alert("Fill out all fields.");
        return;
    }

    const job = {
        id: Date.now(),
        company: company,
        position: position,
        status: status
    };

    jobs.push(job);

    saveJobs();

    document.getElementById("company").value = "";
    document.getElementById("position").value = "";

    renderJobs();
}

function deleteJob(id){

    jobs = jobs.filter(
        job => job.id !== id
    );

    saveJobs();
    renderJobs();
}

function renderJobs(){

    const table =
    document.getElementById("jobTable");

    table.innerHTML = "";

    jobs.forEach(job => {

        const row = `
        <tr>
            <td>${job.company}</td>
            <td>${job.position}</td>
            <td>${job.status}</td>
            <td>
                <button
                class="delete-btn"
                onclick="deleteJob(${job.id})">
                Delete
                </button>
            </td>
        </tr>
        `;

        table.innerHTML += row;
    });

    document.getElementById("total").textContent =
    jobs.length;
}

renderJobs();

</script>

</body>
</html>
